<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convenciones - Bitácora de Pasos de Baile</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 25px;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-radius: 16px;
        }
        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-top: 0;
            margin-bottom: 30px;
        }
        .volver-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            padding: 8px 16px;
            background-color: #f1f5f9;
            color: #0f172a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        .volver-link:hover {
            background-color: #e2e8f0;
            text-decoration: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.95em;
        }
        thead {
            background-color: #0f172a;
            color: white;
        }
        th {
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        td {
            padding: 10px 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        tbody tr:hover {
            background-color: #f8fafc;
        }
        .abreviatura {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            color: #e11d48;
            background: #fef2f2;
            padding: 3px 10px;
            border-radius: 6px;
            display: inline-block;
        }
        .error-message {
            color: #ef4444;
            text-align: center;
            padding: 40px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="volver-link">← Volver a la bitácora</a>
        <h1>📋 Convenciones</h1>
        <p class="subtitle">Abreviaturas y nomenclatura utilizada en la bitácora</p>

        <table id="tabla-convenciones">
            <thead>
                <tr>
                    <th>Abreviatura</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                </tr>
            </thead>
            <tbody id="tbody-convenciones">
                <!-- Se llenará dinámicamente -->
            </tbody>
        </table>
    </div>

    <script>
        function fixEncoding(str) {
            if (!str) return str;
            return str
                .replace(/Ã¡/g, 'á')
                .replace(/Ã©/g, 'é')
                .replace(/Ã­/g, 'í')
                .replace(/Ã³/g, 'ó')
                .replace(/Ãº/g, 'ú')
                .replace(/Ã±/g, 'ñ')
                .replace(/Ã/g, 'Á')
                .replace(/Ã‰/g, 'É')
                .replace(/Ã/g, 'Í')
                .replace(/Ã“/g, 'Ó')
                .replace(/Ãš/g, 'Ú')
                .replace(/Ã‘/g, 'Ñ')
                .replace(/Â¡/g, '¡')
                .replace(/Â¿/g, '¿')
                .replace(/â€œ/g, '"')
                .replace(/â€/g, '"')
                .replace(/â€˜/g, "'")
                .replace(/â€™/g, "'");
        }

        document.addEventListener('DOMContentLoaded', () => {
            const tbody = document.getElementById('tbody-convenciones');

            fetch('convenciones.csv')
                .then(response => {
                    if (!response.ok) throw new Error('No se pudo cargar convenciones.csv. Verifica que esté en la misma carpeta.');
                    return response.text();
                })
                .then(csvText => {
                    const convenciones = parseCSV(csvText);
                    console.log(`✅ Total de convenciones cargadas: ${convenciones.length}`);
                    mostrarConvenciones(convenciones);
                })
                .catch(error => {
                    tbody.innerHTML = `<tr><td colspan="3" class="error-message">❌ Error: ${error.message}</td></tr>`;
                    console.error('❌ Error:', error.message);
                });

            function parseCSV(csvText) {
                const lines = csvText.trim().split('\n');
                if (lines.length < 2) {
                    console.warn('⚠️ El CSV tiene menos de 2 líneas.');
                    return [];
                }
                
                const headers = lines[0].split(';').map(h => h.trim());
                console.log('🔤 Encabezados:', headers);
                
                const data = [];
                for (let i = 1; i < lines.length; i++) {
                    const values = lines[i].split(';').map(v => v.trim());
                    if (values.length >= headers.length) {
                        let entry = {};
                        headers.forEach((header, index) => {
                            entry[header] = fixEncoding(values[index] || '');
                        });
                        data.push(entry);
                    }
                }
                return data;
            }

            function mostrarConvenciones(convenciones) {
                tbody.innerHTML = '';
                if (convenciones.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">No hay convenciones registradas.</td></tr>';
                    return;
                }
                
                convenciones.forEach(conv => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td><span class="abreviatura">${conv.Abreviatura || conv.abreviatura || ''}</span></td>
                        <td><strong>${conv.Nombre || conv.nombre || ''}</strong></td>
                        <td>${conv.Descripcion || conv.descripcion || ''}</td>
                    `;
                    tbody.appendChild(fila);
                });
            }
        });
    </script>
</body>
</html>
